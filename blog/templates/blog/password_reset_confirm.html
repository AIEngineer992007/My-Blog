{% extends "blog/base.html" %}
{% block content %}

<div class="auth-box">
    {% if validlink %}
        <h1 class="auth-heading">Đặt mật khẩu mới</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.new_password1 }}
            {{ form.new_password2 }}
            <button type="submit" class="auth-btn">Đổi mật khẩu</button>
        </form>
    {% else %}
        <p class="auth-subtext">Link đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</p>
    {% endif %}
</div>

{% endblock content %}
