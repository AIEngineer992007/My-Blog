{% extends "blog/base.html" %}

{% block content %}

<div class="auth-box">
    <h1 class="auth-heading">Quên mật khẩu?</h1>
    <p class="auth-subtext">Nhập email bạn đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu.</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit" class="auth-btn">Gửi link đặt lại mật khẩu</button>
    </form>
</div>

{% endblock content %}
